{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<section class="tarjeta tarjeta--angosta error-pagina">
  <img class="tarjeta__sello" src="{{ estatico('img/logo-isotipo.svg') }}" width="72" height="72" alt="">
  <p class="error-pagina__codigo">{{ t('Error {codigo}', codigo=codigo) }}</p>
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  {% if ayuda %}<p class="texto-suave" lang="es">{{ ayuda }}</p>{% endif %}
  <p><a class="boton" href="{{ url_for('publico.inicio') }}">{{ t('Ir al inicio') }}</a></p>
</section>
{% endblock %}
